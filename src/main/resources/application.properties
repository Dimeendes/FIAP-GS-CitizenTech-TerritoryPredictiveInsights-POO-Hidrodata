# Nome da aplicação
spring.application.name=hidrodata

# Aplicação de console: sem servidor web
spring.main.web-application-type=none
spring.main.banner-mode=off

# Banco H2 gravado em ARQUIVO (os dados sobrevivem ao reiniciar)
spring.datasource.url=jdbc:h2:file:./data/hidrodata
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Roda o schema.sql em toda inicialização (as tabelas usam IF NOT EXISTS)
spring.sql.init.mode=always

# Deixa o console limpo para o menu (só mostra avisos e erros)
logging.level.root=WARN